<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="400" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#060913" />
    </linearGradient>
    <linearGradient id="glow" x1="100" y1="50" x2="300" y2="350" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="skin" x1="150" y1="120" x2="250" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="shadow" x="0" y="0" width="400" height="400" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#6366F1" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Card Backdrop -->
  <rect width="400" height="400" rx="40" fill="url(#bg)" stroke="url(#glow)" stroke-width="3" filter="url(#shadow)"/>

  <!-- Subtle Geometric Grid / Code Circles -->
  <circle cx="200" cy="180" r="140" stroke="#312E81" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.6"/>
  <circle cx="200" cy="180" r="115" stroke="#4338CA" stroke-width="1" opacity="0.4"/>

  <!-- Ambient Glow Behind Avatar -->
  <circle cx="200" cy="175" r="85" fill="#6366F1" opacity="0.25" filter="blur(30px)"/>

  <!-- Silhouette / Avatar Graphic -->
  <!-- Body / Shoulders -->
  <path d="M110 350C110 295 145 270 200 270C255 270 290 295 290 350" fill="#3B82F6" opacity="0.85"/>
  <path d="M140 350C140 310 165 285 200 285C235 285 260 310 260 350" fill="#1E293B"/>
  
  <!-- Collar / Shirt Detail -->
  <path d="M185 285L200 315L215 285" fill="#60A5FA"/>

  <!-- Neck -->
  <rect x="186" y="220" width="28" height="40" rx="8" fill="#FBBF24"/>

  <!-- Head -->
  <ellipse cx="200" cy="180" rx="52" ry="58" fill="#FBBF24"/>

  <!-- Hair / Modern Cut -->
  <path d="M146 170C146 125 170 115 200 115C232 115 254 125 254 170C250 150 236 135 200 135C164 135 150 152 146 170Z" fill="#1E1B4B"/>
  <path d="M148 165C148 135 170 120 205 120C240 120 252 140 252 165C252 145 235 130 200 130C165 130 152 145 148 165Z" fill="#0F172A"/>

  <!-- Glasses / Developer look -->
  <rect x="162" y="166" width="30" height="20" rx="6" fill="#0284C7" fill-opacity="0.15" stroke="#38BDF8" stroke-width="3"/>
  <rect x="208" y="166" width="30" height="20" rx="6" fill="#0284C7" fill-opacity="0.15" stroke="#38BDF8" stroke-width="3"/>
  <line x1="192" y1="175" x2="208" y2="175" stroke="#38BDF8" stroke-width="3"/>
  <line x1="152" y1="174" x2="162" y2="174" stroke="#38BDF8" stroke-width="2.5"/>
  <line x1="238" y1="174" x2="248" y2="174" stroke="#38BDF8" stroke-width="2.5"/>

  <!-- Smile -->
  <path d="M188 212C194 218 206 218 212 212" stroke="#B45309" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Floating Tech Badges -->
  <!-- Top Left: React / Code badge -->
  <g transform="translate(45, 80)">
    <rect width="64" height="30" rx="15" fill="#0F172A" stroke="#06B6D4" stroke-width="1.5"/>
    <text x="32" y="19" fill="#38BDF8" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">&lt;/&gt;</text>
  </g>

  <!-- Top Right: Python / ML badge -->
  <g transform="translate(290, 80)">
    <rect width="65" height="30" rx="15" fill="#0F172A" stroke="#8B5CF6" stroke-width="1.5"/>
    <text x="32" y="19" fill="#C084FC" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">Py 🐍</text>
  </g>

  <!-- Bottom Right: MCA badge -->
  <g transform="translate(265, 290)">
    <rect width="90" height="32" rx="16" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
    <circle cx="282" cy="306" r="4" fill="#10B981"/>
    <text x="52" y="20" fill="#34D399" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">MCA 2026</text>
  </g>
</svg>
